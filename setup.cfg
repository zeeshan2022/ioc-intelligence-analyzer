# NOTE: pytest configuration lives in pytest.ini and pyproject.toml.
# This file carries coverage + lint tool configuration only.

[coverage:run]
source = app,main
branch = True
omit = tests/*

[coverage:report]
fail_under = 80
show_missing = True
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if __name__ == .__main__.::

[flake8]
max-line-length = 110
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,reports,.venv
